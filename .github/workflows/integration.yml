name: Integration Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  grid-tests:
    name: Selenium Grid Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start Selenium Grid
        run: |
          docker compose up -d selenium-hub
          for i in $(seq 1 30); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' selenium-hub 2>/dev/null || echo "starting")
            echo "selenium-hub health: $STATUS ($i/30)"
            if [ "$STATUS" = "healthy" ]; then
              break
            fi
            sleep 2
          done
          docker compose up -d chromium
          docker compose logs
      - name: Run grid tests
        run: pnpm --filter @michaelhly.webdriver-c11y/selenium-impl run test:grid
      - name: Stop Selenium Grid
        if: always()
        run: docker compose down
