name: Integration Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  grid-tests:
    name: Selenium Grid Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start Selenium Grid
        run: |
          docker compose up -d selenium-hub chromium
          docker compose logs -f &
          LOGS_PID=$!
          for i in $(seq 1 30); do
            if docker inspect --format='{{.State.Health.Status}}' selenium-hub 2>/dev/null | grep -q healthy; then
              echo "Selenium Hub is healthy"
              kill $LOGS_PID 2>/dev/null || true
              exit 0
            fi
            sleep 2
          done
          echo "Selenium Hub did not become healthy"
          kill $LOGS_PID 2>/dev/null || true
          exit 1
      - name: Run grid tests
        run: pnpm --filter @michaelhly.webdriver-c11y/selenium-impl run test:grid
      - name: Stop Selenium Grid
        if: always()
        run: docker compose down
